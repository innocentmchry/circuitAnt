# circuitAnt configuration (paths are relative to this file).

# Which chat model answers the requests: openai or claude.
provider: openai

# Keys are read from this file, one KEY="value" per line:
# OPENAI_API_KEY for openai, CLAUDE_API_KEY (or ANTHROPIC_API_KEY) for claude.
api_key_file: ./.env

# cache: use the provider's prompt cache (repeated prompt beginnings billed cheaper; answers
# are unchanged).  OpenAI always caches; for Claude it is this switch.
# price: USD per 1M tokens, for the cost columns of the run analysis (developer mode).
# Leave it out to leave them empty.  Check the providers' price pages when changing model.
openai:
  model: gpt-4o-mini
  # price: {input: 0.15, cached_input: 0.075, output: 0.60}

claude:
  model: claude-haiku-4-5
  cache: true
  # price: {input: 1.00, cached_input: 0.10, cache_write: 1.25, output: 5.00}

# How the model reaches the tools in agent/tools.py (see agent/tool_access/).
#   all:   every tool, sent with every LLM call.
#   graph: every tool through the tool knowledge graph: their names in the system prompt,
#          describe (several at once) -> pick one -> run_tool.
# Without an access line the mode is all.
tools:
  # access: all
  access: graph
  graph:
    core: []            # tools offered directly instead (e.g. [set_testcase_name, read_design, write_design])
    catalog: names      # names: tool names only; summaries: each with its one-line summary
    sparql: false       # also offer read-only SPARQL over the graph
    search: false       # temporary keyword search_tools: keep off (to be replaced by embedding search)
    knowledge: true     # include knowledge.ttl (concepts and synonyms, followedBy)

# Logs: every run gets its own folder, debugging/logs/<run id>/ (run.sh: one for all
# its testcases), holding openroad.log -- everything OpenROAD prints, kept off stdout,
# which carries only the #RESPONSE blocks -- and, in developer mode, the request logs.

# Testcase logs (<case>.log), written designs and result lists (paths_*.txt, cone_*.txt, ...)
# go here (relative to this file).  Leave it out to write them to the current directory.
output_dir: ./output_temp

# How netlists are read (read_design).  iccad: the ICCAD gate-primitive format on the
# built-in gate library.  generic: any gate-level Verilog OpenROAD can read, with
# its own LEF (technology first) and Liberty files.  Generic netlists must be flattened
# (a single module); that module is the top.
design:
  format: iccad
  # format: generic
  # lef: [/home/innocent/OpenROAD/test/Nangate45/Nangate45_tech.lef,
  #       /home/innocent/OpenROAD/test/Nangate45/Nangate45_stdcell.lef]
  # liberty: [/home/innocent/OpenROAD/test/Nangate45/Nangate45_typ.lib]

developer:
  mode: true          # one human-readable log per request in debugging/logs/<run>/, and
                      # the tools each request called in debugging/run_analysis_<run>.csv
  # log_dir: /some/dir  # logs go to <log_dir>/logs/<run>/ instead of debugging/logs/<run>/

# Hybrid Semantic Tool-Call Caching Framework
# Leave commented out or set enabled: false for baseline circuitAnt execution.
cache:
  enabled: false
  strategy: full_hybrid  # exact, semantic, semantic_structural, full_hybrid
  embedding_model: all-MiniLM-L6-v2
  cosine_threshold: 0.80
  reranker_enabled: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
  structural_validation_enabled: true
  parameter_substitution_enabled: true
  reliability_enabled: true
  confidence_threshold: 0.65
